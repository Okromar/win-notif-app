<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notif Windows</title>
  <style>
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h2>Test Notification Windows 11</h2>
  <button id="btnNotif">Envoyer une notification</button>
  <div id="status">Prêt.</div>

  <script>
    document.getElementById("btnNotif").addEventListener("click", async () => {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Envoi en cours...";
      try {
        if (window.__TAURI_INTERNALS__ && typeof window.__TAURI_INTERNALS__.invoke === "function") {
          await window.__TAURI_INTERNALS__.invoke("show_win_notif", {
            title: "Rappel Cours EPHEC",
            body: "Électricité et Circuits DC • Local G-259 à 08:30"
          });
          statusEl.textContent = "Notification envoyée à Windows !";
        } else {
          statusEl.textContent = "API Tauri non détectée.";
        }
      } catch (e) {
        statusEl.textContent = "Erreur : " + e;
      }
    });
  </script>
</body>
</html>
